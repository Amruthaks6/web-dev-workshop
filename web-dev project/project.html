<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Web Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .profile-pic {
      width: 300px;
      margin-bottom:20px;
      border-radius: 50%;
      border:solid #4CAF50
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-success">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 text-white">My Web Page</span>
    </div>
  </nav>

  <div class="container mt-4 text-center">
    <h3>Welcome to My Web Page</h3>
    <img src="https://i.pinimg.com/736x/95/bc/ed/95bced5ab11b902a50495473b48c21b4.jpg" class="profile-pic mt-3" alt="Profile">
    <p class="mt-3">This is a demo web page with table, checkboxes, and radio buttons.</p>

    <table class="table table-bordered mt-4">
      <thead class="table-success">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>manya</td><td>25</td><td>New York</td></tr>
        <tr><td>ranju</td><td>31</td><td>Los Angeles</td></tr>
        <tr><td>sneha</td><td>29</td><td>Chicago</td></tr>
      </tbody>
    </table>

    <form class="mt-4 text-start mx-auto" style="max-width: 400px;">
      <div class="mb-3">
        <h3>
        <label>Select Your Hobbies:</label><br></h3>
        <input type="checkbox" id="reading"> Reading<br>
        <input type="checkbox" id="speaking"> Speaking<br>
        <input type="checkbox" id="music"> Music<br>
        <input type="checkbox" id="sports"> Sports
    </div>

      <div class="mb-3">
        <h3>
        <label>Select Gender:</label><br></h3>
        <input type="radio" name="gender" id="male"> Male<br>
        <input type="radio" name="gender" id="female"> Female<br>
        <input type="radio" name="gender" id="other"> Other
      </div>

      <button type="submit" class="btn btn-success">Submit</button>
      <button type="reset" class="btn btn-danger">Reset</button>
    </form>
  </div>

</body>
</html>
